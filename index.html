    <script>
      ;(function () {
        try {
          var key = 'portfolio-theme'
          var stored = null
          try {
            stored = localStorage.getItem(key)
          } catch (e) {}
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
        } catch (e) {}
      })()
    </script>
